apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhands
  namespace: dev
  labels:
    app.kubernetes.io/name: openhands
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openhands
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openhands
    spec:
      containers:
      - name: openhands
        image: ghcr.io/openhands/agent-canvas:1.13.0
        env:
        - name: LOG_ALL_EVENTS
          value: "true"
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: openhands-state
          mountPath: /home/openhands/.openhands
      volumes:
      - name: openhands-state
        persistentVolumeClaim:
          claimName: openhands-state
---
apiVersion: v1
kind: Service
metadata:
  name: openhands
  namespace: dev
spec:
  selector:
    app.kubernetes.io/name: openhands
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openhands-state
  namespace: dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
