apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: apps
  labels:
    app.kubernetes.io/name: navidrome
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: navidrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: navidrome
    spec:
      containers:
      - name: navidrome
        image: docker.io/deluan/navidrome:0.58.0
        env:
        - name: ND_LASTFM_API_KEY
          valueFrom:
            secretKeyRef:
              name: navidrome
              key: lastfm_api_key
        - name: ND_LASTFM_SECRET
          valueFrom:
            secretKeyRef:
              name: navidrome
              key: lastfm_secret
        ports:
        - containerPort: 4533
        volumeMounts:
        - name: music
          mountPath: /music/library/
        - name: navidrome-data
          mountPath: /data/
      volumes:
      - name: music
        persistentVolumeClaim:
          claimName: music
      - name: navidrome-data
        persistentVolumeClaim:
          claimName: navidrome-data
---
apiVersion: v1
kind: Service
metadata:
  name: navidrome
  namespace: apps
spec:
  selector:
    app.kubernetes.io/name: navidrome
  ports:
    - protocol: TCP
      port: 80
      targetPort: 4533
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-data
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
