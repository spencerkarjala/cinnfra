apiVersion: batch/v1
kind: CronJob
metadata:
  name: import-music
  namespace: apps
spec:
  concurrencyPolicy: Forbid
  schedule: "* * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          initContainers:
          - name: fix-ownership
            image: busybox:latest
            command: ["chown", "-R", "1000:1000", "/music/todo/"]
            volumeMounts:
            - name: music-to-import
              mountPath: /music/todo/
            securityContext:
              runAsUser: 0
          - name: extract-zips
            image: busybox:latest
            command: ["/bin/sh", "-c"]
            args:
              - |
                for zip in /music/todo/*.zip; do
                  [ -f "$zip" ] || continue
                  dir=$(mktemp -d /music/todo/XXXXXXXXXX)
                  mv "$zip" "$dir/"
                  unzip -d "$dir" "$dir/$(basename "$zip")"
                  rm "$dir/$(basename "$zip")"
                done
            volumeMounts:
            - name: music-to-import
              mountPath: /music/todo/
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
          containers:
          - name: import-music
            image: ghcr.io/spencerkarjala/import-music:latest
            volumeMounts:
            - name: music-to-import
              mountPath: /music/todo/
            - name: music-library
              mountPath: /music/done/
          restartPolicy: Never
          volumes:
          - name: script
            hostPath:
              path: /home/skarjala/development/cinnfra/tools/import-music.py
              type: File
          - name: music-to-import
            persistentVolumeClaim:
              claimName: music-to-import
          - name: music-library
            persistentVolumeClaim:
              claimName: music
