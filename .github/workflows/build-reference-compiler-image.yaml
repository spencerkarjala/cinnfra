name: Build and push image for reference-compiler

on:
  push:
    paths:
      - 'apps/reference-compiler/**'
      - '.github/workflows/build-reference-compiler-image.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-reference-compiler-image
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/reference-compiler

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/reference-compiler/dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/reference-compiler:latest
