apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reference-visualizer
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
  - host: reference-visualizer.skarja.la
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: reference-visualizer
            port:
              number: 80
