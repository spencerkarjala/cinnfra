apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metadata-remote
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
  - host: metadata-remote.skarja.la
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: metadata-remote
            port:
              number: 80
