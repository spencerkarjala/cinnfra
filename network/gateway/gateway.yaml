apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: apps
  labels:
    app.kubernetes.io/name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      containers:
      - name: gateway
        image: docker.io/library/nginx:1.29.1-perl
        ports:
        - containerPort: 80
        - containerPort: 443
        volumeMounts:
          - name: nginx-conf
            mountPath: /etc/nginx/nginx.conf
            subPath: gateway.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: gateway-config
            items:
              - key: gateway.conf
                path: gateway.conf
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443